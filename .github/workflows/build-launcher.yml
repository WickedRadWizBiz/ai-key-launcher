name: Build AiKeyLauncher

on:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/build-launcher.yml"]
  pull_request:
    paths: ["src/**", ".github/workflows/build-launcher.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained single file
        run: >
          dotnet publish src/AiKeyLauncher/AiKeyLauncher.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish --nologo -v q
      - uses: actions/upload-artifact@v4
        with:
          name: AiKeyLauncher
          path: publish/AiKeyLauncher.exe
          if-no-files-found: error
